name: Arechi build

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build bootable ISO
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential git nasm mtools xorriso

      - name: Build Arechi
        run: make

      - name: Verify kernel ELF
        run: |
          file kernel.elf
          readelf -h kernel.elf
          readelf -l kernel.elf

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: arechi-iso
          path: arechi.iso
          if-no-files-found: error
